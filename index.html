<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- YouTube requires a referrer on embeds (Error 153 without one). -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Kept out of search results: ?v= wrapper pages have no content of their own. -->
    <meta name="robots" content="noindex">
    <title>YouTube Embed for NetNewsWire Themes — thechelsuk</title>
    <meta name="description"
        content="Plays YouTube videos inside NetNewsWire articles by giving each embed the referrer YouTube needs. Used by thechelsuk's free NetNewsWire themes.">
    <link rel="canonical" href="https://embed.thechels.uk/">
    <meta name="author" content="thechelsuk">
    <meta name="theme-color" content="#ecebe7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_GB">
    <meta property="og:site_name" content="thechelsuk">
    <meta property="og:url" content="https://embed.thechels.uk/">
    <meta property="og:title" content="YouTube Embed for NetNewsWire Themes">

        content="Plays YouTube videos inside NetNewsWire articles by giving each embed the referrer YouTube needs.">
    <meta property="og:image" content="https://themes-nnw.thechels.uk/assets/og-image.jpg">

    <meta property="og:image:height" content="630">

        content="Plays YouTube videos inside NetNewsWire articles by giving each embed the referrer YouTube needs.">
    <meta name="twitter:image" content="https://themes-nnw.thechels.uk/assets/og-image.jpg">
    <meta name="twitter:image:alt" content="Previews of the Claudio, Micha, Maika and Sunjiyo NetNewsWire themes">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://thechels.uk/#person",
          "name": "Mat Benfield",
          "alternateName": "thechelsuk",
          "url": "https://thechels.uk/",
          "sameAs": [
            "https://links.thechels.uk/",
            "https://github.com/thechelsuk"
          ]
        },
        {
          "@type": "WebApplication",
          "@id": "https://embed.thechels.uk/#app",
          "url": "https://embed.thechels.uk/",
          "name": "YouTube Embed for NetNewsWire Themes",
          "description": "Wraps a YouTube embed so it is sent with a referrer, which YouTube requires. NetNewsWire themes embed https://embed.thechels.uk/?v={VIDEO_ID} so videos play inside the reader.",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "inLanguage": "en-GB",
          "isAccessibleForFree": true,
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
          "license": "https://github.com/thechelsuk/uk.thechels.embed/blob/main/LICENSE.md",
          "author": { "@id": "https://thechels.uk/#person" },
          "publisher": { "@id": "https://thechels.uk/#person" },
          "isPartOf": {
            "@type": "WebSite",
            "name": "thechelsuk",
            "url": "https://thechels.uk/"
          },
          "isRelatedTo": {
            "@type": "WebSite",
            "name": "NetNewsWire Themes by thechelsuk",
            "url": "https://themes-nnw.thechels.uk/"
          }
        }
      ]
    }
    </script>
    <script>
        // Decide before first paint, so the placeholder never flashes behind a video.
        if (/^[A-Za-z0-9_-]{11}$/.test(new URLSearchParams(window.location.search).get("v") || "")) {
            document.documentElement.classList.add("has-video");
        }
    </script>
    <style>
        :root {
            --page: #ecebe7;
            --ink: #1d1d1f;
            --muted: #6e6e73;
            --paper: #fbfaf7;
            --paper-edge: #f1efe9;
            --screen: #1c1c1e;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #121212;
                --ink: #f5f5f7;
                --muted: #98989d;
                --paper: #f4f2ed;
                --paper-edge: #e4e1d9;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        html, body {
            margin: 0;
            height: 100%;
            background: #000000;
            color: #ffffff;
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .has-video .placeholder {
            display: none;
        }

        .placeholder {
            box-sizing: border-box;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 56px 24px 32px;
            background: var(--page);
            color: var(--ink);
        }

        .stack {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .stack::before,
        .stack::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--paper-edge);
            box-shadow: 0 2px 10px var(--shadow);
        }

        .stack::before {
            transform: rotate(-3deg) translate(-6px, 6px);
        }

        .stack::after {
            transform: rotate(2deg) translate(6px, 4px);
        }

        .polaroid {
            position: relative;
            z-index: 1;
            margin: 0;
            padding: 22px 22px 30px;
            background: var(--paper);
            color: #1d1d1f;
            box-shadow: 0 12px 32px var(--shadow);
        }

        .screen {
            display: grid;
            place-items: center;
            aspect-ratio: 16 / 9;
            background: var(--screen);
        }

        .screen svg {
            width: 30%;
            height: auto;
        }

        .polaroid h1 {
            margin: 26px 0 14px;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .caption {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 0;
            padding-top: 12px;
            border-top: 2px solid #1d1d1f;
            font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #48484a;
        }

        .tagline {
            max-width: 400px;
            margin: 0;
            font: 26px/1.25 "New York", ui-serif, Georgia, serif;
            text-align: center;
        }

        .tagline em {
            font-weight: 700;
        }

        .site-footer {
            max-width: 400px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .site-footer p {
            margin: 0 0 0.6em;
        }

        .site-footer a {
            color: var(--ink);
            white-space: nowrap;
        }

        code {
            font: 12px ui-monospace, "SF Mono", Menlo, monospace;
        }
    </style>
</head>
<body>
    <!-- Shown only when no video loads; removed before the player is added. -->
    <main class="placeholder" id="placeholder">
        <div class="stack">
            <figure class="polaroid">
                <div class="screen">
                    <svg viewBox="0 0 120 84" role="img" aria-label="No video">
                        <rect x="2" y="2" width="116" height="80" rx="22" fill="none" stroke="#f5f5f7"
                            stroke-width="4" />
                        <path d="M48 33a12 12 0 1 1 18 10.4c-3.6 2.1-6 4.4-6 8.6" fill="none" stroke="#f5f5f7"
                            stroke-width="5" stroke-linecap="round" />
                        <circle cx="60" cy="63" r="3.5" fill="#f5f5f7" />
                    </svg>
                </div>
                <h1>Nothing to play</h1>
                <figcaption class="caption"><span>Invalid or missing video ID</span><span>Nº 153</span></figcaption>
            </figure>
        </div>
        <p class="tagline">YouTube, playing nicely in <em>NetNewsWire</em></p>
        <footer class="site-footer">
            <p>This page lets <a href="https://themes-nnw.thechels.uk/">NetNewsWire themes</a> play YouTube videos
                inside the reader, by supplying the referrer YouTube needs. To play a video, add
                <code>?v=</code> and its 11&#8209;character ID to the address.</p>
            <p><a href="https://thechels.uk/">thechels.uk</a> · <a href="https://links.thechels.uk/">links.thechels.uk</a> ·
                <a href="https://themes-nnw.thechels.uk/">themes-nnw.thechels.uk</a></p>
            <p>© 2026 thechelsuk</p>
        </footer>
    </main>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get("v") || "";

            if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
                return;
            }

            document.getElementById("placeholder").remove();

            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1`;
            iframe.title = "YouTube video player";
            iframe.allow =
                "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;
            document.body.appendChild(iframe);

            // Tell the embedding page (e.g. a NetNewsWire theme) the wrapper loaded.
            if (window.parent !== window) {
                window.parent.postMessage({ type: "thechels-embed-ready", videoId }, "*");
            }
        })();
    </script>
</body>
</html>
