<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- YouTube requires a referrer on embeds (Error 153 without one). -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <title>YouTube Embed</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000000;
            color: #ffffff;
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        p {
            margin: 0;
            padding: 1em;
        }
    </style>
</head>
<body>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get("v") || "";

            if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
                const message = document.createElement("p");
                message.textContent = "Invalid or missing video ID.";
                document.body.appendChild(message);
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1`;
            iframe.title = "YouTube video player";
            iframe.allow =
                "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;
            document.body.appendChild(iframe);

            // Tell the embedding page (e.g. a NetNewsWire theme) the wrapper loaded.
            if (window.parent !== window) {
                window.parent.postMessage({ type: "thechels-embed-ready", videoId }, "*");
            }
        })();
    </script>
</body>
</html>
