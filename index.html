    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000000;
            color: #ffffff;
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        p {
            margin: 0;
            padding: 1em;
        }

        .site-footer {
            padding: 1em;
            color: #8e8e93;
            font-size: 13px;
        }

        .site-footer p {
            padding: 0;
            margin: 0 0 0.5em;
        }

        .site-footer a {
            color: #c7c7cc;
        }
    </style>
</head>
<body>
    <!-- Shown only when no video loads; removed before the player is added. -->
    <footer class="site-footer" id="site-footer">
        <p>This page lets <a href="https://themes-nnw.thechels.uk/">NetNewsWire themes</a> play YouTube videos inside
            the reader, by supplying the referrer YouTube needs.</p>
        <p><a href="https://thechels.uk/">thechels.uk</a> · <a href="https://links.thechels.uk/">links.thechels.uk</a></p>
        <p>© 2026 thechelsuk</p>
    </footer>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get("v") || "";
            const footer = document.getElementById("site-footer");

            if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
                const message = document.createElement("p");
                message.textContent = "Invalid or missing video ID.";
                document.body.insertBefore(message, footer);
                return;
            }

            footer.remove();

            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1`;
            iframe.title = "YouTube video player";
            iframe.allow =
                "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;
            document.body.appendChild(iframe);

            // Tell the embedding page (e.g. a NetNewsWire theme) the wrapper loaded.
            if (window.parent !== window) {
                window.parent.postMessage({ type: "thechels-embed-ready", videoId }, "*");
            }
        })();
    </script>
</body>
</html>
